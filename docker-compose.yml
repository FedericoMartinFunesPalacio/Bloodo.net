services:
  mysql:
    image: mysql:8.0
    container_name: bloodonet-mysql
    restart: always
    environment:
      MYSQL_DATABASE: bloodonet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app-service:
    build:
      context: ./backend/app-service
      dockerfile: Dockerfile
    container_name: bloodonet-backend
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - ./backend/app-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bloodonet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloodonet-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app-service
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  db_data:
